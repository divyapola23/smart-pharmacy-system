{% extends "base.html" %}
{% block title %}{{ 'Edit' if editing else 'Add' }} Medicine{% endblock %}
{% block content %}
<h3 class="mb-3">{{ 'Edit' if editing else 'Add' }} medicine</h3>
<div class="card form-card"><div class="card-body">
<form method="post" class="needs-validation" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="mb-3"><label class="form-label">Medicine name *</label>
    <input class="form-control" name="medicine_name" required maxlength="100" value="{{ med.medicine_name or '' }}"></div>
  <div class="mb-3"><label class="form-label">Category</label>
    <input class="form-control" name="category" maxlength="100" value="{{ med.category or '' }}" placeholder="e.g. Analgesic"></div>
  <div class="mb-3"><label class="form-label">Manufacturer</label>
    <input class="form-control" name="manufacturer" maxlength="100" value="{{ med.manufacturer or '' }}"></div>
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-link" href="{{ url_for('medicines') }}">Cancel</a>
</form></div></div>
{% endblock %}
