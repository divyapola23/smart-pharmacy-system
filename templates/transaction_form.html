{% extends "base.html" %}
{% block title %}Record {{ mode|capitalize }}{% endblock %}
{% block content %}
<h3 class="mb-3">Record {{ mode }}</h3>
<div class="card form-card"><div class="card-body">
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  {% if mode == 'purchase' %}
  <div class="mb-3"><label class="form-label">Existing batch</label>
    <select class="form-select" name="inventory_id" id="existing-batch">
      <option value="">New batch (fill in the details below)</option>
      {% for b in batches %}
        <option value="{{ b.inventory_id }}" {{ 'selected' if form.inventory_id == b.inventory_id|string }}>
          {{ b.medicine_name }} / {{ b.batch_no }} (stock {{ b.quantity }}, exp {{ b.expiry_date }})</option>
      {% endfor %}
    </select></div>
  <fieldset id="new-batch-fields" class="border rounded p-3 mb-3">
    <legend class="float-none w-auto fs-6 px-2">New batch details</legend>
    <div class="row">
      <div class="col-md-6 mb-3"><label class="form-label">Medicine</label>
        <select class="form-select" name="medicine_id">
          <option value="">Select a medicine</option>
          {% for m in medicines %}
            <option value="{{ m.medicine_id }}" {{ 'selected' if form.medicine_id == m.medicine_id|string }}>{{ m.medicine_name }} ({{ m.manufacturer or 'n/a' }})</option>
          {% endfor %}
        </select></div>
      <div class="col-md-6 mb-3"><label class="form-label">Batch number</label>
        <input class="form-control" name="batch_no" maxlength="50" value="{{ form.batch_no or '' }}"></div>
      <div class="col-md-6 mb-3"><label class="form-label">Manufacture date</label>
        <input class="form-control" type="date" name="manufacture_date" value="{{ form.manufacture_date or '' }}"></div>
      <div class="col-md-6 mb-3"><label class="form-label">Expiry date</label>
        <input class="form-control" type="date" name="expiry_date" value="{{ form.expiry_date or '' }}"></div>
      <div class="col-md-6 mb-3"><label class="form-label">Selling price per unit</label>
        <input class="form-control" type="number" min="0" step="0.01" name="selling_price" value="{{ form.selling_price or '' }}"></div>
      <div class="col-md-6 mb-3"><label class="form-label">Reorder level</label>
        <input class="form-control" type="number" min="0" step="1" name="reorder_level" value="{{ form.reorder_level or 10 }}"></div>
    </div>
  </fieldset>
  <div class="row">
    <div class="col-md-6 mb-3"><label class="form-label">Quantity purchased *</label>
      <input class="form-control" type="number" min="1" step="1" name="quantity" required value="{{ form.quantity or '' }}"></div>
    <div class="col-md-6 mb-3"><label class="form-label">Purchase price per unit *</label>
      <input class="form-control" type="number" min="0" step="0.01" name="unit_price" required value="{{ form.unit_price or '' }}"></div>
  </div>

  {% else %}
  <div class="mb-3"><label class="form-label">Batch *</label>
    <select class="form-select" name="inventory_id" id="sale-batch" required>
      <option value="">Select a batch</option>
      {% for b in batches %}
        <option value="{{ b.inventory_id }}" data-price="{{ b.selling_price }}" {{ 'selected' if form.inventory_id == b.inventory_id|string }}>
          {{ b.medicine_name }} / {{ b.batch_no }} (stock {{ b.quantity }}, exp {{ b.expiry_date }})</option>
      {% endfor %}
    </select>
    <div class="form-text">Expired and empty batches are not listed.</div></div>
  <div class="row">
    <div class="col-md-6 mb-3"><label class="form-label">Quantity sold *</label>
      <input class="form-control" type="number" min="1" step="1" name="quantity" required value="{{ form.quantity or '' }}"></div>
    <div class="col-md-6 mb-3"><label class="form-label">Unit price</label>
      <input class="form-control" type="number" min="0" step="0.01" name="unit_price" id="sale-price"
             value="{{ form.unit_price or '' }}" placeholder="Defaults to batch selling price"></div>
  </div>
  {% endif %}

  <button class="btn btn-primary">Save {{ mode }}</button>
  <a class="btn btn-link" href="{{ url_for('transactions') }}">Cancel</a>
</form></div></div>
{% endblock %}
